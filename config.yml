# =============================================================================
# linkyee — Site Configuration
#
# This file is rendered through Liquid: every {{ ... }} below is evaluated
# at build time. Plugin output lives under `vars.<PluginName>` — see
# `plugins/README.md` for the full plugin developer wiki.
# =============================================================================

# Theme — directory under ./themes/. Built-ins:
#   default | minimal-mono | editorial-serif | neo-brutalism
#   glassmorphism | terminal-retro | paper-card | newsprint
theme: default

# HTML <html lang> attribute
lang: "fr"

# Force a color scheme regardless of the visitor's system appearance:
#   auto  — follow OS (default; the page auto-switches between light/dark)
#   light — always render light mode
#   dark  — always render dark mode
# Note: dark-first themes (e.g. terminal-retro) ignore "light" — their
# whole identity is the dark palette.
color_scheme: auto

# -----------------------------------------------------------------------------
# Plugins — none needed for this site right now. See plugins/README.md if
# we want to add dynamic content (RSS, countdowns, etc.) later.
# -----------------------------------------------------------------------------
plugins:

# -----------------------------------------------------------------------------
# Tracking
# -----------------------------------------------------------------------------
google_analytics_id:

# -----------------------------------------------------------------------------
# Profile header
# -----------------------------------------------------------------------------
title: "École du Singe Assis"
avatar: "./images/profile.jpeg"
name: "@sittingmonkeyschool"
tagline: >-
    Coaching somatique • Sophrologie • CNV • Impro — bref, de quoi se
    reconnecter à son corps (et à son enfant intérieur, on y arrive). 🐒

# -----------------------------------------------------------------------------
# Links
#   icon  — Font Awesome class (https://fontawesome.com/search?o=r&m=free)
#   text  — displayed text (Liquid + HTML allowed)
#   title — link title attribute
#   url   — destination
#   alt   — accessibility text
#   target — `_blank` (new tab) or `_self`
# -----------------------------------------------------------------------------
links:
  - link:
      icon: "fa-brands fa-instagram"
      text: "Instagram"
      url: "https://instagram.com/sittingmonkeyschool"
      alt: "École du Singe Assis on Instagram"
      title: "Suis-nous sur Instagram"
      target: "_blank"

  - link:
      icon: "fa-solid fa-people-group"
      text: "La communauté Skool"
      url: "https://www.skool.com/ecole-du-singe-assis-7222/about"
      alt: "École du Singe Assis Skool community"
      title: "Rejoindre la communauté"
      target: "_blank"

  - link:
      icon: "fa-solid fa-globe"
      text: "Le site"
      url: "https://go.sittingmonkeyschool.com/minimonkey_audit"
      alt: "Site principal École du Singe Assis"
      title: "Découvrir le site"
      target: "_blank"

  - link:
      icon: "fa-solid fa-calendar-check"
      text: "Réserver une Session Clarté"
      url: "https://calendly.com/solalphan/30min"
      alt: "Réserver une Session Clarté"
      title: "Réserver une Session Clarté"
      target: "_blank"

  - link:
      icon: "fa-solid fa-language"
      text: "For English speakers!"
      url: "https://www.sittingmonkeyschool.com"
      alt: "English version of the Sitting Monkey School site"
      title: "For English speakers!"
      target: "_blank"

# -----------------------------------------------------------------------------
# Social media buttons
# -----------------------------------------------------------------------------
socials:
  - social:
      icon: "fa-brands fa-instagram"
      url: "https://instagram.com/sittingmonkeyschool"
      title: "Instagram"
      alt: "École du Singe Assis's Instagram"
      target: "_blank"

# -----------------------------------------------------------------------------
# Footer
# -----------------------------------------------------------------------------
footer: ""

# Footer copyright message
# Linkyee is a 100% free, open-source project—feel free to modify the copyright message as you like. :)
copyright: >
  © 2026 École du Singe Assis
