# =============================================================================
# linkyee — Site Configuration
#
# This file is rendered through Liquid: every {{ ... }} below is evaluated
# at build time. Plugin output lives under `vars.<PluginName>` — see
# `plugins/README.md` for the full plugin developer wiki.
# =============================================================================

# Theme — directory under ./themes/. Built-ins:
#   default | minimal-mono | editorial-serif | neo-brutalism
#   glassmorphism | terminal-retro | paper-card | newsprint
theme: sitting-monkey

# HTML <html lang> attribute
lang: "fr"

# Force a color scheme regardless of the visitor's system appearance:
#   auto  — follow OS (default; the page auto-switches between light/dark)
#   light — always render light mode
#   dark  — always render dark mode
# Note: dark-first themes (e.g. terminal-retro) ignore "light" — their
# whole identity is the dark palette.
color_scheme: auto

# -----------------------------------------------------------------------------
# Plugins — none needed for this site right now. See plugins/README.md if
# we want to add dynamic content (RSS, countdowns, etc.) later.
# -----------------------------------------------------------------------------
plugins:

# -----------------------------------------------------------------------------
# Tracking
# -----------------------------------------------------------------------------
google_analytics_id:

# -----------------------------------------------------------------------------
# Profile header
# -----------------------------------------------------------------------------
title: "École du Singe Assis"
avatar: "./images/avatar.png"
name: "L'École du Singe Assis"
tagline: >-
    <span class="pill pill-gold">Coaching somatique</span>
    <span class="pill pill-sage">Sophrologie</span>
    <span class="pill pill-gold">CNV</span>
    <span class="pill pill-sage">Impro</span>
    <br>
    tout ce qu'il te faut pour te reconnecter à ton corps (et à ton enfant intérieur, on y arrive). 🐒

# -----------------------------------------------------------------------------
# Cartes, rangées par catégorie
#   badge : « Offert » ou un prix (« 27 € »)
#   image : fichier dans themes/sitting-monkey/images/magnets/
# -----------------------------------------------------------------------------
sections:
  - title: "Commence ici"
    sub: "Des outils pour revenir dans ton corps, à ton rythme. Offerts."
    cards:
      - title: "L'avis d'expulsion"
        meta: "Outil interactif · 5 min"
        badge: "Offert"
        hook: "Une règle squatte ta tête ?"
        text: "« Je dois être productif·ve », « je ne dois pas déranger »… Tu la nommes, tu la remercies, tu la dis à voix haute de 5 façons, et tu la mets dehors. Tu repars avec ton avis d'expulsion, signé de ton prénom."
        cta: "Je la mets dehors"
        url: "https://go.sittingmonkeyschool.com/expulsion"
        image: "./images/magnets/expulsion.jpg"
        alt: "Un singe assis, l'air pensif"

      - title: "Les 4 pas de la CNV"
        meta: "Jeu · 3 min"
        badge: "Offert"
        hook: "Un conflit te trotte dans la tête ?"
        text: "Tu démêles ce qui s'est passé de ce que tu te racontes, tu trouves les mots justes pour ce que tu ressens, et tu repars avec une phrase claire, prête à être dite."
        cta: "Je joue"
        url: "https://go.sittingmonkeyschool.com/4-pas"
        image: "./images/magnets/4-pas.jpg"
        alt: "Un singe assis, l'air contrarié"

      - title: "Ton geste signal"
        meta: "Audio guidé · 10 min"
        badge: "Offert"
        hook: "Ton bouton calme, au bout des doigts."
        text: "Tu relies un petit geste discret à un souvenir doux. Avant une réunion, un appel ou un moment qui te stresse, tu refais le geste, et ton corps retrouve la sensation."
        cta: "J'écoute"
        url: "https://go.sittingmonkeyschool.com/gestesignal"
        image: "./images/magnets/geste-signal.jpg"
        alt: "Un singe, les yeux fermés, apaisé"

      - title: "Mini Monkey Audit"
        meta: "Quiz · 13 questions · 3 min"
        badge: "Offert"
        hook: "Où en est ton enfant intérieur ?"
        text: "13 questions pour découvrir ton profil Mini Monkey et voir à quel point tu es connecté·e à ton enfant intérieur. Résultat immédiat."
        cta: "Je découvre mon profil"
        url: "https://go.sittingmonkeyschool.com/minimonkey_audit"
        image: "./images/magnets/audit.jpg"
        alt: "Un jeune singe curieux"

  - title: "Pratiquer ensemble"
    sub: "La communauté et les ressources. Gratuites, pour toujours."
    cards:
      - title: "Les Cercles de Parole"
        meta: "En groupe · en ligne sur Skool"
        badge: "Gratuit"
        hook: "Tu n'es pas seul·e à vivre ça."
        text: "Des cercles en ligne pour déposer ce qui pèse, écouter et être écouté·e, avec les outils de la CNV. Caméra libre, sans jugement, et ce qui est dit dans le cercle reste dans le cercle."
        cta: "Je rejoins la communauté"
        url: "https://www.skool.com/ecole-du-singe-assis-7222/about"
        image: "./images/magnets/cercles.jpg"
        alt: "Des personnes assises en cercle sous une tente"

      - title: "La liste des émotions et des besoins"
        meta: "Fiche à télécharger"
        badge: "Offert"
        hook: "Des mots pour ce qui se passe en toi."
        text: "La liste des émotions et des besoins de la CNV, à garder dans ton téléphone pour les moments où tout se mélange."
        cta: "Je la télécharge"
        url: "https://drive.proton.me/urls/1B1MA2Q76M#BZnuH631X5VD"
        image: "./images/magnets/emotions.jpg"
        alt: "Un singe, la main sur la bouche, l'air ému"

      - title: "Le yoga du singe"
        meta: "Fiche à télécharger"
        badge: "Offert"
        hook: "Ton corps a besoin de bouger le matin ?"
        text: "Ma routine du matin en 20 étapes, plus un renfo au poids du corps. Chaque exercice illustré, à suivre à ton rythme. En français et en anglais."
        cta: "Je la télécharge"
        url: "https://drive.proton.me/urls/GQVYHXS158#Yc7lnI8RqdJm"
        image: "./images/magnets/yoga.jpg"
        alt: "Un singe debout sur un tronc qui s'étire, un bras derrière la tête"

  - title: "Être accompagné·e"
    sub: "Quand tu veux qu'on avance ensemble, en ligne."
    cards:
      - title: "L'appel découverte"
        meta: "Visio · 30 min"
        badge: "Offert"
        hook: "On fait connaissance ?"
        text: "30 minutes pour me raconter où tu en es et ce qui te bloque. On regarde ensemble si et comment je peux t'accompagner."
        cta: "Je réserve mon appel"
        url: "https://cal.com/sittingmonkeyscheduling/decouverte"
        image: "./images/magnets/appel.jpg"
        alt: "Solal en clown, un pot de yaourt à l'oreille comme téléphone"

      - title: "Mini Monkey Reset"
        meta: "Programme en ligne · accès immédiat"
        badge: "27 €"
        hook: "Tu ressens tout, ou plus rien ?"
        text: "Un programme pour sortir de l'anxiété et de la perte de direction, et retrouver un quotidien vivant et relaxé. Satisfait·e ou remboursé·e pendant 7 jours."
        cta: "Je me reconnecte"
        url: "https://go.sittingmonkeyschool.com/mini_monkey_reset"
        image: "./images/magnets/mmr.jpg"
        alt: "Un singe concentré, les mains jointes"

      - title: "La Session Clarté"
        meta: "Visio · 45 min"
        badge: "45 €"
        hook: "Un nœud que tu n'arrives pas à défaire ?"
        text: "45 minutes en ligne, toi et moi, pour comprendre plus profondément un conflit, intérieur ou extérieur, et repartir avec une piste claire."
        cta: "Je réserve ma session"
        url: "https://cal.com/sittingmonkeyscheduling/clarte"
        image: "./images/magnets/clarte.jpg"
        alt: "Un singe de profil, le regard au loin"

  - title: "In English"
    sub: "Sessions and resources for English speakers."
    cards:
      - title: "Free Discovery Call"
        meta: "Video call · 30 min"
        badge: "Free"
        hook: "Let's get to know each other."
        text: "30 minutes to tell me where you are right now and what's holding you back. We'll see together if and how I can support you, in English."
        cta: "Book my call"
        url: "https://cal.com/sittingmonkeyscheduling/discovery"
        image: "./images/magnets/discovery-en.jpg"
        alt: "Solal, smiling"

      - title: "School of the Sitting Monkey"
        meta: "Website · online sessions"
        hook: "For English speakers!"
        text: "Somatic coaching, sophrology, NVC and improv, online and in English. Discover the school and book a session."
        cta: "Visit the website"
        url: "https://www.sittingmonkeyschool.com"
        image: "./images/magnets/english.jpg"
        alt: "Un dragonnier sous le soleil, photographié par Solal"

